# Rust skill manifest: every upstream unit in sources/rust/ maps to a rule, a pattern,
# a lint, or an exclusion with a reason. build/compile.py refuses to build otherwise.
#
# Unit ids: M-* (Microsoft guideline id), G:<anchor> (Google style guide section),
# P:<path> (rust-unofficial page), GOF:<slug> (refactoring.guru page).
# A rule's `text` is the one line the model reads on the card; where the upstream
# guides conflict, the text states the resolved rule (Microsoft over Google).
# scope: "all" (default), "lib" (binding in crates other crates depend on), "app".

