# TypeScript skill manifest: every upstream unit in sources/typescript/ maps to a rule, a
# pattern, a lint, or an exclusion with a reason. build/compile.py refuses to build otherwise.
#
# Unit ids: G:<anchor> (Google TypeScript Style Guide section, by its page anchor),
# P:<slug> (Systemic TypeScript page), GOF:<slug> (refactoring.guru page). Oxlint's Tier 1-2
# rules are not units: they reach the model through the generated oxlintrc.jsonc and the
# vendored lint/ docs.

