# Python skill manifest: every upstream unit in sources/python/ maps to a rule, a pattern,
# a lint, or an exclusion with a reason. build/compile.py refuses to build otherwise.
#
# Unit ids: G:<anchor> (Google Python Style Guide section, by its page anchor) and
# P:<path> (python-patterns.guide page, by its URL path). Ruff's Tier 1-2 rules are not
# units: they reach the model through the generated ruff.toml and the vendored lint/ docs.

